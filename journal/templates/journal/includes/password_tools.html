{% load static %}
{% load i18n %}
{% comment %}
Кнопка «Сгенерировать пароль»: заполняет оба поля пароля и показывает его,
чтобы можно было записать или скопировать. Вставлять внутрь <form>.
{% endcomment %}
<div class="rounded-xl border border-slate-200 bg-slate-50 p-3" data-password-tools>
    <div class="flex flex-wrap items-center gap-2">
        <button type="button" data-generate
                class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100">
            {% trans "Сгенерировать пароль" %}
        </button>
        <code data-password class="hidden rounded-lg border border-slate-200 bg-white px-3 py-2 font-mono text-sm text-slate-800"></code>
        <button type="button" data-copy
                class="hidden rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700">
            {% trans "Скопировать" %}
        </button>
    </div>
    <p data-hint class="mt-2 hidden text-xs text-amber-700">
        {% trans "Запишите или скопируйте пароль сейчас — после сохранения он больше не отобразится." %}
    </p>
</div>
<script src="{% static 'journal/includes-password-tools.js' %}?v=24" defer></script>
