# fail2ban для электронного журнала
#
# Задача: если с одного адреса идёт перебор адресов (сканер уязвимостей) или подбор
# пароля, — блокировать его на уровне сервера. Приложение уже умеет блокировать
# сканеров само (раздел «Безопасность»), а fail2ban закрывает доступ целиком,
# ещё до обработки запроса Django.
#
# Куда положить:
#   /etc/fail2ban/filter.d/journal-probes.conf
#   /etc/fail2ban/jail.d/journal.conf
#
# --- /etc/fail2ban/filter.d/journal-probes.conf ---------------------------------
#
# [Definition]
# failregex = ^<HOST> - - \[[^\]]+\] "(?:GET|POST|HEAD) /(?:\.env|\.git|wp-admin|wp-login|phpmyadmin|graphql|actuator|debug/|\.vscode|telescope|_catalog|server-status|info\.php|config\.json|trace\.axd)[^"]*" \d{3}
# ignoreregex =
#
# --- /etc/fail2ban/jail.d/journal.conf -----------------------------------------
#
# [journal-probes]
# enabled  = true
# filter   = journal-probes
# # Путь к журналу контейнера: docker compose logs web > /var/log/journal-web.log
# # (проще всего писать логи в файл через logging-драйвер json-file и читать его,
# #  либо поставить перед приложением nginx и смотреть его access.log)
# logpath  = /var/log/nginx/access.log
# maxretry = 5
# findtime = 600
# bantime  = 86400
# action   = iptables-multiport[name=journal, port="http,https"]
#
# --- nginx вместо fail2ban (проще и надёжнее) ----------------------------------
#
# limit_req_zone $binary_remote_addr zone=journal:10m rate=30r/m;
#
# server {
#     location / {
#         limit_req zone=journal burst=20 nodelay;
#         proxy_pass http://127.0.0.1:8000;
#         proxy_set_header Host $host;
#         # Приложению нужен настоящий адрес клиента: оно берёт его из
#         # X-Forwarded-For, а если тот не передан — из X-Real-IP.
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Real-IP $remote_addr;
#     }
#     # Служебные адреса закрываем совсем — их не должно быть в журнале.
#     location ~ /\.(env|git|vscode|ssh) { return 444; }
#     location ~ ^/(wp-admin|wp-login|phpmyadmin|graphql|actuator|debug/|telescope) { return 444; }
# }
#
# --- что важно помнить ---------------------------------------------------------
#
# 1. Поставьте DEBUG=0 в .env: в бою подробные ошибки наружу не нужны.
# 2. Не публикуйте порт 8000 во внешнюю сеть: в docker-compose.yml укажите
#    "127.0.0.1:8000:8000" и поставьте перед приложением nginx, либо оставьте
#    доступ только из своей сети.
# 3. Если включаете TRUST_PROXY_HEADERS=1, приложение будет брать адрес клиента
#    из X-Forwarded-For, а если этого заголовка нет — из X-Real-IP (как в примере
#    для nginx выше); тогда блокировки работают по настоящему адресу клиента,
#    а не по адресу прокси. Без TRUST_PROXY_HEADERS оба заголовка игнорируются:
#    доверять им можно только за своим прокси.
# 4. Настройте уведомления по почте в разделе «Безопасность»: об автоблокировке
#    приходит письмо.
